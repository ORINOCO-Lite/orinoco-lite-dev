[workspace]
name = "orinoco-lite-engineering"
channels = ["conda-forge"]
platforms = [{ platform = "osx-arm64", macos = "14.0" }, "linux-64"]
requires-pixi = ">=0.76,<0.77"

[dependencies]
python = ">=3.12,<3.13"

[tasks]
test-engine = "python -m unittest discover -s packages/orinoco-lite/tests -v"
test-development = "python -m unittest tests.test_checkout_submodules tests.test_development_environments tests.test_pages_publication tests.test_restore_annex_status tests.test_upstream_stack_contract tests.test_upstream_pool_diff tests.test_adapt_upstream_pages -v"
test = { depends-on = ["test-engine", "test-development"] }
checkout-submodules = "python tools/checkout_submodules.py"
build-upstream-static = '"$PIXI_EXE" run --frozen --script tools/upstream_static.py build'
serve-upstream-static = '"$PIXI_EXE" run --frozen --script tools/upstream_static.py serve'
build-upstream-static-worktree = '"$PIXI_EXE" run --frozen --script tools/upstream_static.py build --checkout worktree'
serve-upstream-static-worktree = '"$PIXI_EXE" run --frozen --script tools/upstream_static.py serve --checkout worktree'
serve-upstream = "python tools/upstream_full_launcher.py serve recorded"
serve-upstream-worktree = "python tools/upstream_full_launcher.py serve worktree"
check-upstream = "python tools/upstream_full_launcher.py check recorded"
check-upstream-worktree = "python tools/upstream_full_launcher.py check worktree"
test-upstream-full = "python tools/upstream_full_launcher.py test recorded"
diff-upstream-pool = "python tools/upstream_pool_diff.py"
format-docs = { cmd = "snapper --in-place README.md AGENTS.md docs/*.md" }
install-hooks = { cmd = "git config core.hooksPath .githooks" }
check-format = { cmd = "pre-commit run --all-files" }

[pypi-dependencies]
orinoco-lite = { path = "packages/orinoco-lite", editable = true }
snapper-fmt = "==0.8.1"
pre-commit = "==4.3.0"
