[workspace]
requires-pixi = ">=0.76"
name = "orinoco-lite-engineering"
channels = ["conda-forge"]
platforms = [{ platform = "osx-arm64", macos = "14.0" }, { platform = "linux-64", glibc = "2.34" }]

# Prefer "*"; bound known incompatibilities; use == only as a last resort.
# Explain exceptions beside their declaration.
# pixi.lock is a local, untracked development resolution.
[dependencies]
python = "*"
git = "*"
# The selected Congo theme uses .Site.Author, removed in Hugo 0.156.
hugo = "<0.156"

[pypi-dependencies]
# Python requirements and editable submodule sources come from pyproject.toml.
orinoco-lite = { path = ".", editable = true }

[tasks]
records-jsonl-to-yaml = "datalad run --explicit --input sourcedata/downloaded/records.jsonl --output site-specific/metadata orinoco-lite dev records jsonl-to-yaml"
records-get = "datalad run --explicit --output sourcedata/downloaded/records.jsonl --output sourcedata/downloaded/records.jsonl.manifest.json orinoco-lite dev records get"

[feature.dev.dependencies]
nodejs = "*"
make = "*"

[feature.dev.pypi-dependencies]
build = "*"
setuptools = "*"
snapper-fmt = "*"
pre-commit = "*"
pytest = "*"

[feature.dev.tasks]
build-package = "python -m build --outdir build/package"
setup-upstream = "bash tools/setup-upstream.sh"
install-hooks = "git config core.hooksPath .githooks"

[feature.skills.dependencies]
python = "*"

[feature.skills.pypi-dependencies]
apm-cli = "*"

[feature.skills.tasks]
setup-skills = "apm install --frozen"
audit-skills = "apm audit --ci"

[environments]
default = ["dev"]
skills = { features = ["skills"], no-default-feature = true }
