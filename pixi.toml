[workspace]
requires-pixi = ">=0.76"
name = "orinoco-lite-engineering"
channels = ["conda-forge"]
platforms = [{ platform = "osx-arm64", macos = "14.0" }, { platform = "linux-64", glibc = "2.34" }]

# Prefer "*"; bound known incompatibilities; use == only as a last resort.
# Explain exceptions beside their declaration.
# pixi.lock retains resolved versions; update it deliberately.
[dependencies]
python = "*"
git = "*"
hugo = "*"

[pypi-dependencies]
datalad = "*"
click-option-group = "*"
copier = "*"
git-annex = "*"

Jinja2 = "*"
linkml = "*"
linkml-runtime = "*"
packaging = "*"
pydantic = "*"
pyoxigraph = "*"
PyYAML = "*"
tomlkit = "*"
rdflib = "*"

# Install this checkout and its selected submodules editable.
# Release generation converts these paths to repository URLs and committed revisions.
orinoco-lite = { path = ".", editable = true }
dump-things-pyclient = { path = "submodules/dump-things-pyclient", editable = true }
dump-things-service = { path = "submodules/dump-things-service", editable = true }
things-enrichment-tools = { path = "submodules/things-enrichment-tools", editable = true }
query-things = { path = "submodules/query-things", editable = true }
datalad-concepts = { path = "submodules/things-schemas", editable = true }

# query-things depends on dump-things-pyclient through a Git URL.
# Override that dependency with the selected dump-things-pyclient submodule.
# Keep the direct entries above: an override alone is not installed editable.
[pypi-options.dependency-overrides]
dump-things-pyclient = { path = "submodules/dump-things-pyclient", editable = true }

[tasks]
records-jsonl-to-yaml = "datalad run --explicit --input sourcedata/downloaded/records.jsonl --output site-specific/metadata orinoco-lite dev records jsonl-to-yaml"
records-get = "datalad run --explicit --output sourcedata/downloaded/records.jsonl --output sourcedata/downloaded/records.jsonl.manifest.json orinoco-lite dev records get"

[feature.dev.dependencies]
nodejs = "*"
make = "*"

[feature.dev.pypi-dependencies]
build = "*"
snapper-fmt = "*"
pre-commit = "*"
pytest = "*"

[feature.dev.tasks]
build-package = "python -m build --outdir build/package"
setup-upstream = "bash tools/setup-upstream.sh"
install-hooks = "git config core.hooksPath .githooks"

[feature.skills.dependencies]
python = "*"

[feature.skills.pypi-dependencies]
apm-cli = "*"

[feature.skills.tasks]
setup-skills = "apm install --frozen"
audit-skills = "apm audit --ci"

[environments]
default = ["dev"]
skills = { features = ["skills"], no-default-feature = true }
