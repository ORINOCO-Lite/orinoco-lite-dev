[workspace]
name = "orinoco-lite-engineering"
channels = ["conda-forge"]
platforms = [{ platform = "osx-arm64", macos = "14.0" }, "linux-64"]
requires-pixi = ">=0.76,<0.77"

[dependencies]
python = ">=3.12,<3.13"
git = ">=2.55.0,<3"
hugo = "==0.161.1"
nodejs = ">=22,<23"
make = "==4.4.1"

[target.linux-64.dependencies]
git-annex = "==10.20260601"

[target.osx-arm64-macos-14-0.pypi-dependencies]
git-annex = "==10.20260601"

[pypi-dependencies]
orinoco-lite = { path = "packages/orinoco-lite", editable = true }
build = "==1.6.0"
snapper-fmt = "==0.10.0"
pre-commit = "==4.3.0"

[tasks]
build-package = "python -m build packages/orinoco-lite --outdir build/package"
check-locks = "pixi lock --check"
test-package = "python tools/run_unittests.py --discover packages/orinoco-lite/tests"
test-package-strict = "python tools/run_unittests.py --fail-on-skip --discover packages/orinoco-lite/tests"
test-development = "python -m unittest tests.test_checkout_submodules tests.test_development_environments tests.test_downstream_development tests.test_materialize_presentation_assets tests.test_restore_annex_status tests.test_run_unittests tests.test_upstream_stack_contract tests.test_upstream_pool_diff tests.test_upstream_snapshot tests.test_upstream_orinoco_records tests.test_adapt_upstream_pages -v"
test = { depends-on = ["test-package", "test-development"] }
test-ci = { depends-on = ["test-package-strict", "test-development"] }
checkout-submodules = "python tools/checkout_submodules.py"
build-upstream-static = "python tools/upstream_static.py build"
serve-upstream-static = "python tools/upstream_static.py serve"
build-upstream-static-worktree = "python tools/upstream_static.py build --checkout worktree"
serve-upstream-static-worktree = "python tools/upstream_static.py serve --checkout worktree"
serve-upstream = "python tools/upstream_full_launcher.py serve recorded"
serve-upstream-worktree = "python tools/upstream_full_launcher.py serve worktree"
check-upstream = "python tools/upstream_full_launcher.py check recorded"
check-upstream-worktree = "python tools/upstream_full_launcher.py check worktree"
test-upstream-full = "python tools/upstream_full_launcher.py test recorded"
test-downstream-candidate = "python tools/downstream_development.py"
test-template-candidate-quick = "python tools/run_template_candidate.py quick"
test-template-candidate-full = "python tools/run_template_candidate.py full"
diff-upstream-pool = "python tools/upstream_pool_diff.py"
snapshot-upstream-records = "python tools/prepare_upstream_snapshot.py"
refresh-upstream-records = "python tools/prepare_upstream_snapshot.py --refresh"
materialize-presentation-assets = "python tools/materialize_presentation_assets.py"
format-docs = { cmd = "snapper --in-place README.md AGENTS.md docs/*.md" }
install-hooks = { cmd = "git config core.hooksPath .githooks" }
check-format = { cmd = "pre-commit run --all-files" }
