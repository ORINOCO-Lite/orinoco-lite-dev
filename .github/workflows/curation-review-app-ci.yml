name: Curation review application

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/curation-review-app-ci.yml
      - packages/curation-review-app/**
  push:
    branches:
      - main
    paths:
      - .github/workflows/curation-review-app-ci.yml
      - packages/curation-review-app/**

permissions:
  contents: read

jobs:
  check:
    name: Locked application checks
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: packages/curation-review-app
    steps:
      - name: Check out only the parent repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: false

      - name: Install the exact Node runtime
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          cache: npm
          cache-dependency-path: packages/curation-review-app/package-lock.json
          node-version: "22.23.2"

      - name: Install the exact npm runtime
        run: |
          npm install --global npm@11.6.0
          test "$(node --version)" = "v22.23.2"
          test "$(npm --version)" = "11.6.0"

      - name: Install locked application dependencies
        run: npm ci --ignore-scripts

      - name: Run the complete application checks
        run: npm run check
