name: Orinoco release artifacts

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version to apply while assembling the artifact
        required: true
        type: string
  push:
    tags:
      - v*

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  release-artifacts:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the exact release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Initialize only release-authorized components
        shell: bash
        run: |
          git submodule update --init --depth 1 -- \
            submodules/pool.psychoinformatics.de-ui \
            submodules/query-things \
            submodules/things-schemas
          git -C submodules/pool.psychoinformatics.de-ui submodule update \
            --init --depth 1 -- shacl-vue

      - name: Install the package environment
        uses: prefix-dev/setup-pixi@f00437f565399d418b0acc85936d12c1fb668347 # v0.10.1
        with:
          cache: true
          frozen: true
          pixi-version: v0.76.2

      - name: Set the release version
        env:
          RELEASE_VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          pixi run python - <<'PY'
          import os, pathlib, re
          from packaging.version import Version

          version = os.environ["RELEASE_VERSION"].removeprefix("v")
          if str(Version(version)) != version:
              raise SystemExit("Release version must be canonical PEP 440")
          path = pathlib.Path("packages/orinoco-lite/pyproject.toml")
          source, count = re.subn(r'(?m)^version = "[^"]+"$',
                                  f'version = "{version}"', path.read_text())
          if count != 1:
              raise SystemExit("Could not set the release version")
          path.write_text(source)
          PY

      - name: Build twice and compare release artifacts
        env:
          SOURCE_DATE_EPOCH: "0"
        run: |
          for destination in release/dist release/dist-repeat; do
            pixi run build-package --outdir "$destination"
            pixi run python -m orinoco_lite.release_package "$destination"/*.tar.gz
          done
          cmp release/dist/*.whl release/dist-repeat/*.whl
          cmp release/dist/*.tar.gz release/dist-repeat/*.tar.gz
          (cd release/dist && sha256sum -- *.whl *.tar.gz > SHA256SUMS)

      - name: Test the installed release wheel
        run: |
          wheels=(release/dist/*.whl)
          pixi add --pypi "orinoco-lite @ $PWD/${wheels[0]}"
          pixi run orinoco-lite --version
          pixi run orinoco-lite --help
          pixi run test-package-strict

      - name: Attest the release artifact checksums
        id: attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-checksums: release/dist/SHA256SUMS

      - name: Include the provenance bundle in the release set
        env:
          ATTESTATION_BUNDLE: ${{ steps.attestation.outputs.bundle-path }}
        run: cp "$ATTESTATION_BUNDLE" release/dist/orinoco-provenance-bundle.jsonl

      - name: Upload immutable release candidates
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: orinoco-lite-release-candidate
          path: release/dist
          if-no-files-found: error
          retention-days: 14
