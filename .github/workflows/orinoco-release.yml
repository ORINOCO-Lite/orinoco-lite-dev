name: Orinoco release artifacts

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version matching the Python package
        required: true
        type: string
  push:
    tags:
      - v*

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  release-artifacts:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the exact release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Initialize only release-authorized components
        shell: bash
        run: |
          git submodule sync -- \
            submodules/pool.psychoinformatics.de-ui \
            submodules/query-things \
            submodules/things-schemas
          git submodule update --init --depth 1 -- \
            submodules/pool.psychoinformatics.de-ui \
            submodules/query-things \
            submodules/things-schemas
          git -C submodules/pool.psychoinformatics.de-ui submodule sync -- \
            shacl-vue
          git -C submodules/pool.psychoinformatics.de-ui submodule update \
            --init --depth 1 -- shacl-vue

      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12.13"

      - name: Install exact Node and npm toolchain
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22.23.2"

      - name: Verify exact release toolchain
        shell: bash
        run: |
          npm install --global npm@10.9.4
          test "$(python --version)" = "Python 3.12.13"
          test "$(node --version)" = "v22.23.2"
          test "$(npm --version)" = "10.9.4"

      - name: Build deterministic package resources and artifacts
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          version="$INPUT_VERSION"
          spec="release/package-resources.yaml"
          if [ -z "$version" ]; then
            version="${GITHUB_REF_NAME#v}"
          fi
          python -m pip install --disable-pip-version-check PyYAML==6.0.2
          SPEC="$spec" VERSION="$version" python - <<'PY'
          import os, pathlib, tomllib
          package = tomllib.loads(pathlib.Path("packages/orinoco-lite/pyproject.toml").read_text())
          if str(package["project"]["version"]) != os.environ["VERSION"]:
              raise SystemExit("package version does not match requested version")
          PY
          editor_source="$(mktemp -d)"
          cp -R submodules/pool.psychoinformatics.de-ui/. "$editor_source/"
          PYTHONPATH=packages/orinoco-lite/src \
            python -m orinoco_lite.release_editor \
            --pool-ui "$editor_source" \
            --overlay release/editor-v2 \
            --shell build/resources-editor-shell \
            --licenses build/resources-editor-licenses
          find build/resources-schema -mindepth 1 -delete 2>/dev/null || true
          mkdir -p build/resources-schema
          PYTHONPATH=packages/orinoco-lite/src \
            python -m orinoco_lite.release_schema \
            --source-root submodules/things-schemas/src \
            --entry submodules/things-schemas/src/demo-research-information/unreleased.yaml \
            --destination build/resources-schema
          npm install --global npm@11.6.0
          test "$(npm --version)" = "11.6.0"
          PYTHONPATH=packages/orinoco-lite/src \
            python -m orinoco_lite.release_review \
            --application packages/curation-review-app \
            --shell build/resources-review-shell \
            --licenses build/resources-review-licenses
          python -m pip install --disable-pip-version-check build==1.3.0
          package_source="$(mktemp -d)/orinoco-lite"
          cp -R packages/orinoco-lite "$package_source"
          PYTHONPATH=packages/orinoco-lite/src python -c '\
          from pathlib import Path; from orinoco_lite.stage_resources import stage_package_resources; \
          stage_package_resources(Path("'"$spec"'"), Path("'"$package_source"'/src/orinoco_lite/_resources"), source_commit="'"$GITHUB_SHA"'")'
          find release/dist release/dist-repeat -mindepth 1 -delete 2>/dev/null || true
          mkdir -p release/dist release/dist-repeat
          SOURCE_DATE_EPOCH=0 python -m build "$package_source" --outdir release/dist
          SOURCE_DATE_EPOCH=0 python -m build "$package_source" --outdir release/dist-repeat
          PYTHONPATH=packages/orinoco-lite/src python -m orinoco_lite.release_package \
            release/dist/orinoco_lite-*.tar.gz
          PYTHONPATH=packages/orinoco-lite/src python -m orinoco_lite.release_package \
            release/dist-repeat/orinoco_lite-*.tar.gz
          cmp release/dist/orinoco_lite-*.whl release/dist-repeat/orinoco_lite-*.whl
          cmp release/dist/orinoco_lite-*.tar.gz release/dist-repeat/orinoco_lite-*.tar.gz
          mv build/resources-editor-shell build/resources-editor-shell-first
          mv build/resources-editor-licenses build/resources-editor-licenses-first
          mv build/resources-review-shell build/resources-review-shell-first
          mv build/resources-review-licenses build/resources-review-licenses-first
          editor_source_repeat="$(mktemp -d)"
          cp -R submodules/pool.psychoinformatics.de-ui/. "$editor_source_repeat/"
          npm install --global npm@10.9.4
          test "$(npm --version)" = "10.9.4"
          PYTHONPATH=packages/orinoco-lite/src \
            python -m orinoco_lite.release_editor \
            --pool-ui "$editor_source_repeat" \
            --overlay release/editor-v2 \
            --shell build/resources-editor-shell \
            --licenses build/resources-editor-licenses
          npm install --global npm@11.6.0
          test "$(npm --version)" = "11.6.0"
          PYTHONPATH=packages/orinoco-lite/src \
            python -m orinoco_lite.release_review \
            --application packages/curation-review-app \
            --shell build/resources-review-shell \
            --licenses build/resources-review-licenses
          diff -qr build/resources-editor-shell-first build/resources-editor-shell
          diff -qr build/resources-editor-licenses-first build/resources-editor-licenses
          diff -qr build/resources-review-shell-first build/resources-review-shell
          diff -qr build/resources-review-licenses-first build/resources-review-licenses
          (
            cd release/dist
            find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\0' \
              | sort -z | xargs -0 sha256sum > SHA256SUMS
          )

      - name: Attest the release artifact checksums
        id: attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-checksums: release/dist/SHA256SUMS

      - name: Include the provenance bundle in the release set
        env:
          ATTESTATION_BUNDLE: ${{ steps.attestation.outputs.bundle-path }}
        run: cp "$ATTESTATION_BUNDLE" release/dist/orinoco-provenance-bundle.jsonl

      - name: Verify the installed package and bundled-resource contracts
        shell: bash
        run: |
          set -o pipefail
          python -m venv build/release-test
          build/release-test/bin/pip install --disable-pip-version-check \
            release/dist/orinoco_lite-*.whl
          build/release-test/bin/python - <<'PY'
          from pathlib import Path
          import sys
          import orinoco_lite
          from orinoco_lite.resources import load_resources, source_commit

          package = Path(orinoco_lite.__file__).parent
          assert str(package).startswith(sys.prefix)
          resources = load_resources(package / "_resources")
          source_commit(resources.root)
          for required in (
              "schema/demo-research-information/unreleased.yaml",
              "editor-shell/index.html",
              "review-shell/index.html",
              "drivers/adapt_pages.py",
          ):
              assert (resources.root / required).is_file(), required
          PY
          build/release-test/bin/python tools/run_unittests.py \
            --fail-on-skip --discover packages/orinoco-lite/tests \
            2>&1 | tee build/release-tests.log

      - name: Upload immutable release candidates
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: orinoco-lite-release-candidate
          path: release/dist
          if-no-files-found: error
          retention-days: 14
