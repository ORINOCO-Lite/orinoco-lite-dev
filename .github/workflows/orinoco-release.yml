name: Orinoco release artifacts

on:
  workflow_dispatch:
  push:
    tags:
      - v*

permissions:
  contents: read
  id-token: write
  attestations: write

env:
  PIXI_LOCKED: "false"

jobs:
  release-artifacts:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the exact release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Initialize only release-authorized components
        shell: bash
        run: |
          git submodule update --init --depth 1 -- \
            submodules/pool.psychoinformatics.de-ui \
            submodules/query-things \
            submodules/dump-things-pyclient \
            submodules/dump-things-service \
            submodules/things-enrichment-tools \
            submodules/www-from-model \
            submodules/things-schemas
          git -C submodules/pool.psychoinformatics.de-ui submodule update \
            --init --depth 1 -- shacl-vue

      - name: Install the package environment
        uses: prefix-dev/setup-pixi@f00437f565399d418b0acc85936d12c1fb668347 # v0.10.1
        with:
          cache: false
          locked: false

      - name: Build twice and compare release artifacts
        env:
          SOURCE_DATE_EPOCH: "0"
        run: |
          for destination in release/dist release/dist-repeat; do
            pixi run build-package --outdir "$destination"
            pixi run python -m orinoco_lite.release_package "$destination"/*.tar.gz
          done
          cmp release/dist/*.whl release/dist-repeat/*.whl
          cmp release/dist/*.tar.gz release/dist-repeat/*.tar.gz

      - name: Test the installed release wheel
        run: |
          wheels=(release/dist/*.whl)
          pixi add --pypi "orinoco-lite @ $PWD/${wheels[0]}"
          pixi run orinoco-lite --version
          pixi run orinoco-lite --help
          pixi run python - <<'PY'
          from importlib.metadata import distribution
          from packaging.requirements import Requirement
          from _build_backend import package_dependencies
          import json
          required = {str(Requirement(value)) for value in distribution("orinoco-lite").requires}
          assert required == {str(Requirement(value)) for value in package_dependencies()}
          for value in required:
              requirement = Requirement(value)
              if requirement.url and requirement.url.startswith("git+"):
                  selected = json.loads(distribution(requirement.name).read_text("direct_url.json"))
                  assert selected["vcs_info"]["commit_id"] == requirement.url.rsplit("@", 1)[1], selected
                  assert not selected.get("dir_info", {}).get("editable"), selected
          PY
          pixi run pytest --ignore=tests/engineering

      - name: Generate and test the release environment
        env:
          RELEASE_REPOSITORY: ${{ github.server_url }}/${{ github.repository }}.git
        run: |
          pixi run python -m orinoco_lite.release_package --environment \
            --revision "$GITHUB_SHA" --repository-url "$RELEASE_REPOSITORY" \
            > release/dist/pixi.toml
          pixi lock --manifest-path release/dist/pixi.toml
          consumer=$(mktemp -d)
          cp release/dist/pixi.toml release/dist/pixi.lock "$consumer/"
          pixi install --locked --manifest-path "$consumer/pixi.toml"
          pixi run --manifest-path "$consumer/pixi.toml" orinoco-lite --version
          pixi run --manifest-path "$consumer/pixi.toml" orinoco-lite --help
          pixi run --manifest-path "$consumer/pixi.toml" hugo version
          pixi run --manifest-path "$consumer/pixi.toml" git-annex version
          pixi run --manifest-path "$consumer/pixi.toml" python - <<'PY'
          from importlib.metadata import distributions
          import json
          for package in distributions():
              source = json.loads(package.read_text("direct_url.json") or "{}")
              assert not source.get("dir_info", {}).get("editable"), source
              assert not source.get("url", "").startswith("file:"), source
          import dump_things_pyclient, dump_things_service, pyoxigraph, rdflib
          PY
          (cd release/dist && sha256sum -- *.whl *.tar.gz pixi.toml pixi.lock > SHA256SUMS)

      - name: Attest the release artifact checksums
        id: attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-checksums: release/dist/SHA256SUMS

      - name: Include the provenance bundle in the release set
        env:
          ATTESTATION_BUNDLE: ${{ steps.attestation.outputs.bundle-path }}
        run: cp "$ATTESTATION_BUNDLE" release/dist/orinoco-provenance-bundle.jsonl

      - name: Upload immutable release candidates
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: orinoco-lite-release-candidate
          path: release/dist
          if-no-files-found: error
          retention-days: 14
