name: Engineering environment

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - codex/stage-*
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  package:
    name: Engineering contracts (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-24.04
          - macos-14
    steps:
      - name: Check out only the parent repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize only release-authorized compatibility components
        shell: bash
        run: |
          git submodule update --init --depth 1 -- \
            submodules/pool.psychoinformatics.de-ui \
            submodules/query-things \
            submodules/dump-things-pyclient \
            submodules/www-from-model \
            submodules/things-schemas
          git -C submodules/pool.psychoinformatics.de-ui submodule update \
            --init --depth 1 -- shacl-vue

      - name: Install the locked package environment
        uses: prefix-dev/setup-pixi@f00437f565399d418b0acc85936d12c1fb668347 # v0.10.1
        with:
          cache: true
          frozen: true
          pixi-version: v0.76.2

      - name: Check dependency locks
        run: pixi lock --check

      - name: Verify pre-commit formatting
        run: pixi run pre-commit run --all-files

      - name: Prepare editable package resources
        run: pixi run orinoco-lite dev prepare-resources

      - name: Install the browser regression runtime
        shell: bash
        run: |
          pixi run npm install --prefix "$RUNNER_TEMP/review-browser" --no-save playwright@1.62.1
          pixi run node "$RUNNER_TEMP/review-browser/node_modules/playwright/cli.js" install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/review-browser/node_modules" >> "$GITHUB_ENV"
          echo "ORINOCO_REQUIRE_BROWSER_TESTS=1" >> "$GITHUB_ENV"

      - name: Run package and engineering tests
        run: pixi run pytest

      - name: Build the source archive and verify its installed wheel
        shell: bash
        run: |
          pixi run build-package
          wheels=(build/package/*.whl)
          pixi add --pypi "orinoco-lite @ $PWD/${wheels[0]}"
          pixi run python - <<'PY'
          from importlib.metadata import distribution
          import json
          from pathlib import Path
          import sysconfig

          import orinoco_lite

          installed = Path(orinoco_lite.__file__).resolve()
          site_packages = Path(sysconfig.get_path("purelib")).resolve()
          assert installed.is_relative_to(site_packages), installed
          source = json.loads(distribution("orinoco-lite").read_text("direct_url.json"))
          assert "archive_info" in source and source["url"].endswith(".whl"), source
          assert not source.get("dir_info", {}).get("editable", False), source
          print(f"Testing installed wheel: {installed}")
          PY
          pixi run orinoco-lite --help
          pixi run pytest --ignore=tests/engineering
