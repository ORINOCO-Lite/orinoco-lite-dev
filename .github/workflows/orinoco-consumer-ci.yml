name: Orinoco consumer CI

on:
  workflow_call:
    inputs:
      command:
        description: "Consumer facade task: validate, build, or test-all"
        type: string
        required: false
        default: test-all
      runner:
        description: GitHub-hosted runner label
        type: string
        required: false
        default: ubuntu-24.04
      artifact-name:
        description: Optional name of an artifact to upload after the task
        type: string
        required: false
        default: ""
      artifact-path:
        description: Consumer-relative artifact path
        type: string
        required: false
        default: build/site
      pixi-version:
        description: Exact Pixi release used to run the locked consumer
        type: string
        required: false
        default: v0.73.0

permissions:
  contents: read

jobs:
  consumer:
    name: ${{ inputs.command }} (${{ inputs.runner }})
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 60
    steps:
      - name: Validate reusable-workflow inputs
        shell: bash
        env:
          ORINOCO_COMMAND: ${{ inputs.command }}
          ORINOCO_ARTIFACT_PATH: ${{ inputs['artifact-path'] }}
        run: |
          case "$ORINOCO_COMMAND" in
            validate|build|test-all) ;;
            *)
              echo "command must be validate, build, or test-all" >&2
              exit 2
              ;;
          esac
          case "$ORINOCO_ARTIFACT_PATH" in
            /*|*..*|*\\*)
              echo "artifact-path must be a safe repository-relative path" >&2
              exit 2
              ;;
          esac

      - name: Check out the ordinary consumer repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install locked Pixi
        uses: prefix-dev/setup-pixi@f00437f565399d418b0acc85936d12c1fb668347
        with:
          pixi-version: ${{ inputs['pixi-version'] }}
          cache: true
          frozen: true

      - name: Restore the exact Playwright browser cache
        if: ${{ inputs.command == 'test-all' }}
        id: playwright-browser-cache
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: "5"
        with:
          path: |
            build/playwright-browsers
            !build/playwright-browsers/.links
          key: orinoco-playwright-v1-${{ inputs.runner }}-${{ runner.os }}-${{ runner.arch }}-chromium-webkit-${{ hashFiles('pixi.toml', '.orinoco-lite/tests/browser/package.json', '.orinoco-lite/tests/browser/package-lock.json', '.orinoco-lite/tools/install_browser_tests.py') }}

      - name: Bound Linux package mirror operations
        if: ${{ inputs.command == 'test-all' && runner.os == 'Linux' }}
        shell: bash
        run: |
          printf '%s\n' \
            'Acquire::Retries "3";' \
            'Acquire::http::Timeout "30";' \
            'Acquire::https::Timeout "30";' \
            | sudo tee /etc/apt/apt.conf.d/99orinoco-network-bounds >/dev/null

      - name: Run the consumer facade
        shell: bash
        env:
          ORINOCO_COMMAND: ${{ inputs.command }}
        run: pixi run "$ORINOCO_COMMAND"

      # PRs may restore the default branch's public browser cache, but only a
      # successful default-branch push may publish one. This avoids large,
      # merge-ref-scoped caches while keeping cache misses fully supported.
      - name: Save the exact Playwright browser cache
        if: >-
          ${{
            success() &&
            inputs.command == 'test-all' &&
            github.event_name == 'push' &&
            github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
            steps.playwright-browser-cache.outputs.cache-hit != 'true'
          }}
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            build/playwright-browsers
            !build/playwright-browsers/.links
          key: orinoco-playwright-v1-${{ inputs.runner }}-${{ runner.os }}-${{ runner.arch }}-chromium-webkit-${{ hashFiles('pixi.toml', '.orinoco-lite/tests/browser/package.json', '.orinoco-lite/tests/browser/package-lock.json', '.orinoco-lite/tools/install_browser_tests.py') }}

      - name: Upload the requested consumer artifact
        if: ${{ inputs['artifact-name'] != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ inputs['artifact-name'] }}
          path: ${{ inputs['artifact-path'] }}
          if-no-files-found: error
          retention-days: 14
