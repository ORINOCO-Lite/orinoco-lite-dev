[build-system]
requires = ["setuptools==80.9.0", "PyYAML==6.0.2", "versioneer[toml]==0.29"]
build-backend = "_build_backend"
backend-path = ["."]

[project]
name = "orinoco-lite"
dynamic = ["version"]
description = "Location-independent build and release interface for Orinoco Lite sites"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Center for Open Neuroscience" }]

classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
]

[project.scripts]
orinoco-lite = "orinoco_lite.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }
script-files = ["scripts/orinoco-lite-populate-upstream.sh"]

[tool.setuptools.package-data]
orinoco_lite = ["default_projection.yaml", "_resources/**/*"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --import-mode=importlib"

[tool.versioneer]
VCS = "git"
style = "pep440"
versionfile_source = "src/orinoco_lite/_version.py"
versionfile_build = "orinoco_lite/_version.py"
tag_prefix = "v"
parentdir_prefix = "orinoco_lite-"
