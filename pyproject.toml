[build-system]
requires = ["setuptools==80.9.0", "PyYAML==6.0.2"]
build-backend = "_build_backend"
backend-path = ["."]

[project]
name = "orinoco-lite"
version = "0.3.0rc6"
description = "Location-independent build and release interface for Orinoco Lite sites"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Center for Open Neuroscience" }]
dependencies = [
  "dump-things-pyclient @ git+https://github.com/ORINOCO-Lite/dump-things-pyclient.git@1e79391195ad4412286344189dc5f81a06accb90",
  "dump-things-service==6.3.6",
  "Jinja2==3.1.6",
  "linkml==1.11.1",
  "linkml-runtime==1.11.1",
  "packaging==26.3",
  "pydantic==2.13.4",
  "PyYAML==6.0.2",
  "tomlkit>=0.13,<1",
  "rdflib==7.6.0",
  "things-enrichment-tools @ git+https://github.com/ORINOCO-Lite/things-enrichment-tools.git@9f036a4cdfb53f87346152f9cd4620aaef38bce2",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
]

[project.scripts]
orinoco-lite = "orinoco_lite.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }
script-files = ["scripts/orinoco-lite-populate-upstream"]

[tool.setuptools.package-data]
orinoco_lite = ["default_projection.yaml", "_resources/**/*"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --import-mode=importlib"
