[build-system]
requires = ["setuptools==80.9.0", "PyYAML==6.0.2", "versioneer[toml]==0.29", "tomlkit>=0.13", "packaging>=24"]
build-backend = "_build_backend"
backend-path = ["."]

[project]
name = "orinoco-lite"
dynamic = ["version", "dependencies"]
description = "Location-independent build and release interface for Orinoco Lite sites"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Center for Open Neuroscience" }]

classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
]

[project.scripts]
orinoco-lite = "orinoco_lite.cli:main"

# Pixi/uv follow these sources when this package is installed from its checkout.
# Git submodules select the revisions; editable installs use working-tree edits.
[tool.uv.sources]
dump-things-pyclient = { path = "submodules/dump-things-pyclient", editable = true }
dump-things-service = { path = "submodules/dump-things-service", editable = true }
things-enrichment-tools = { path = "submodules/things-enrichment-tools", editable = true }
query-things = { path = "submodules/query-things", editable = true }
datalad-concepts = { path = "submodules/things-schemas", editable = true }

# Build metadata derives exact source requirements from the committed gitlinks.
[dependency-groups]
runtime = [
  "datalad",
  "git-annex",
  "copier",
  "click-option-group",
  "dump-things-pyclient",
  "dump-things-service",
  "things-enrichment-tools",
  "query-things",
  "datalad-concepts",
  "Jinja2",
  # LinkML 1.12 emits inherited predicates that the pinned service cannot read.
  "linkml<1.12",
  "linkml-runtime<1.12",
  "packaging",
  "pydantic",
  "pyoxigraph",
  "PyYAML",
  "tomlkit",
  "rdflib",
]

[tool.setuptools]
package-dir = { "" = "src" }
script-files = ["scripts/orinoco-lite-populate-upstream.sh"]

[tool.setuptools.package-data]
# Setuptools globs omit dot-directories. Ship the selected upstream workflow
# verbatim alongside the other runtime resources for installed-wheel projection.
orinoco_lite = [
  "_resources/**/*",
  "_resources/www-from-model/.forgejo/workflows/update-from-pool.yaml",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --import-mode=importlib"

[tool.versioneer]
VCS = "git"
style = "pep440"
versionfile_source = "src/orinoco_lite/_version.py"
versionfile_build = "orinoco_lite/_version.py"
tag_prefix = "v"
parentdir_prefix = "orinoco_lite-"
