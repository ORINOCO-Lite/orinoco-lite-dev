[workspace]
name = "orinoco-lite-skills"
channels = ["conda-forge"]
platforms = [{ platform = "osx-arm64", macos = "14.0" }, "linux-64"]
requires-pixi = ">=0.76,<0.77"

[dependencies]
python = ">=3.12,<3.13"

[pypi-dependencies]
apm-cli = "==0.28.0"

[tasks]
install = { cmd = "apm install --frozen", cwd = "../.." }
audit = { cmd = "apm audit --ci", cwd = "../.." }
