repos:
  - repo: local
    hooks:
      - id: reuse
        name: REUSE compliance
        entry: uvx --from reuse==5.1.1 reuse lint
        language: system
        pass_filenames: false
      - id: snapper
        name: snapper semantic line breaks
        entry: snapper --in-place
        language: system
        files: '\.(md|markdown|rst|txt)$'
        exclude: '^(\.agents/skills/asd-ste100-skill/|LICENSES/)'
