repos:
  - repo: local
    hooks:
      - id: snapper
        name: snapper semantic line breaks
        entry: snapper --native --in-place
        language: system
        files: '\.(md|markdown|rst|txt)$'
        exclude: '^\.agents/skills/asd-ste100-skill/'
      - id: submodule-divergence
        name: staged submodule CSV and commit titles
        entry: python3 tools/submodule_divergence.py --staged --check
        language: system
        pass_filenames: false
        always_run: true
